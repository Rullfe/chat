<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API 余额面板</title>
<style>
  :root {
    --bg0: #0b1220;
    --bg1: #101a2e;
    --card: rgba(255, 255, 255, 0.05);
    --card-border: rgba(255, 255, 255, 0.08);
    --text: #e8eef7;
    --muted: #93a2b8;
    --accent: #34d399;
    --accent2: #38bdf8;
    --danger: #f87171;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(56, 189, 248, 0.14), transparent 60%),
      radial-gradient(1000px 500px at 90% 0%, rgba(52, 211, 153, 0.10), transparent 55%),
      linear-gradient(160deg, var(--bg0), var(--bg1));
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .container { width: 100%; max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; flex: 1; }

  /* ---------- 认证页 ---------- */
  .auth-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .auth-card {
    width: 100%; max-width: 400px;
    background: var(--card); border: 1px solid var(--card-border); border-radius: 20px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    padding: 32px 28px;
  }
  .auth-logo { text-align: center; margin-bottom: 22px; }
  .auth-logo .dot {
    display: inline-block; width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    box-shadow: 0 8px 24px rgba(56, 189, 248, 0.35);
  }
  .auth-logo h1 { margin-top: 12px; font-size: 20px; font-weight: 600; }
  .auth-logo p { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .tabs { display: flex; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 4px; margin-bottom: 22px; }
  .tabs button {
    flex: 1; padding: 10px 0; border: 0; background: transparent; color: var(--muted);
    font-size: 14px; border-radius: 9px; cursor: pointer; transition: all .2s;
  }
  .tabs button.active { background: rgba(56,189,248,0.16); color: var(--text); font-weight: 600; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 11px 14px; font-size: 14px; color: var(--text);
    background: rgba(255,255,255,0.06); border: 1px solid var(--card-border); border-radius: 10px;
    outline: none; transition: border .2s;
  }
  .field input:focus { border-color: var(--accent2); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px 20px; font-size: 14px; font-weight: 600; color: #06212e;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border: 0; border-radius: 10px; cursor: pointer; transition: transform .15s, box-shadow .2s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(52,211,153,0.25); }
  .btn:disabled { opacity: .6; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn.full { width: 100%; }
  .btn.ghost { background: rgba(255,255,255,0.08); color: var(--text); }
  .btn.danger { background: rgba(248,113,113,0.14); color: var(--danger); }
  .btn.small { padding: 6px 12px; font-size: 12px; border-radius: 8px; }
  .btn .spin { display: none; }
  .btn.loading .spin { display: inline-block; }
  .btn.loading .spin svg { animation: rot 0.8s linear infinite; }
  .btn.loading { opacity: .7; pointer-events: none; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 10px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 18px; text-align: center; line-height: 1.6; }

  /* ---------- 主界面 ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .dot { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--accent2), var(--accent)); }
  .brand h1 { font-size: 17px; font-weight: 600; }
  .userbox { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .userbox .name { color: var(--text); font-weight: 500; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 16px;
    padding: 16px 18px; backdrop-filter: blur(10px);
  }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 24px; font-weight: 700; margin-top: 6px; }
  .stat .v.ok { color: var(--accent); }
  .stat .v.bad { color: var(--danger); }
  .stat .v.small { font-size: 15px; line-height: 1.5; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar .refresh-hint { font-size: 12px; color: var(--muted); }

  .keys { display: flex; flex-direction: column; gap: 14px; }
  .empty {
    text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px;
    border: 1px dashed var(--card-border); border-radius: 16px;
  }
  .kcard {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 16px;
    padding: 18px 20px; backdrop-filter: blur(10px);
    animation: fadeUp .35s ease both;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .kcard .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .kcard .title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .kcard .title .nm { font-weight: 600; font-size: 15px; }
  .kcard .title .mask { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); background: rgba(255,255,255,0.05); padding: 3px 8px; border-radius: 6px; }
  .kcard .endpoint { font-size: 12px; color: var(--muted); margin-top: 4px; word-break: break-all; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 99px; font-weight: 600; white-space: nowrap; }
  .badge.ok { background: rgba(52,211,153,0.15); color: var(--accent); }
  .badge.fail { background: rgba(248,113,113,0.15); color: var(--danger); }
  .kcard .body { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
  .bal { line-height: 1; }
  .bal .num { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
  .bal .num.zero { color: var(--muted); }
  .bal .unit { font-size: 13px; color: var(--muted); margin-left: 6px; }
  .bal .err-text { font-size: 13px; color: var(--danger); font-weight: 600; }
  .kcard .meta { font-size: 12px; color: var(--muted); text-align: right; }
  .kcard .meta div { margin-top: 3px; }
  .kcard .ops { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }

  /* ---------- 弹窗 ---------- */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(4, 8, 16, 0.7); backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .modal-mask.open { opacity: 1; pointer-events: auto; }
  .modal {
    width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
    background: #131d30; border: 1px solid var(--card-border); border-radius: 18px;
    padding: 26px; box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    transform: translateY(10px); transition: transform .2s;
  }
  .modal-mask.open .modal { transform: none; }
  .modal h2 { font-size: 17px; margin-bottom: 4px; }
  .modal .sub { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
  .modal .field textarea {
    width: 100%; padding: 10px 14px; font-size: 13px; color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: rgba(255,255,255,0.06); border: 1px solid var(--card-border); border-radius: 10px; outline: none; resize: vertical; min-height: 64px;
  }
  .modal .field textarea:focus { border-color: var(--accent2); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal .ops { display: flex; gap: 12px; margin-top: 20px; }
  .modal .ops .btn { flex: 1; }
  .modal select {
    width: 100%; padding: 10px 14px; font-size: 14px; color: var(--text);
    background: rgba(255,255,255,0.06); border: 1px solid var(--card-border); border-radius: 10px; outline: none;
  }
  .modal select option { background: #131d30; }

  /* ---------- Toast ---------- */
  .toasts { position: fixed; top: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 10px; }
  .toast {
    background: #16243a; border: 1px solid var(--card-border); color: var(--text);
    padding: 12px 18px; border-radius: 12px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    max-width: 340px; animation: slideIn .25s ease both;
  }
  .toast.error { border-color: rgba(248,113,113,0.5); }
  .toast.ok { border-color: rgba(52,211,153,0.5); }
  @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }

  .footer { text-align: center; font-size: 12px; color: var(--muted); padding: 20px; }
  @media (max-width: 560px) {
    .kcard .body { align-items: flex-start; }
    .row2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ================= 认证页（默认显示，登录后由 JS 切换到主界面） ================= -->
<div id="authView" class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="dot"></div>
      <h1>API 余额面板</h1>
      <p>统一查询多个平台的 API 余额</p>
    </div>
    <div class="tabs">
      <button id="tabLogin" class="active" onclick="switchTab('login')">登录</button>
      <button id="tabReg" onclick="switchTab('reg')">注册</button>
    </div>
    <form id="loginForm" onsubmit="return doLogin(event)">
      <div class="field"><label>用户名</label><input id="loginUser" autocomplete="username" placeholder="3-32 位字母/数字/下划线"></div>
      <div class="field"><label>密码</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="至少 6 位"></div>
      <button class="btn full" type="submit">登 录</button>
      <div class="err" id="loginErr"></div>
    </form>
    <form id="regForm" style="display:none" onsubmit="return doRegister(event)">
      <div class="field"><label>用户名</label><input id="regUser" autocomplete="username" placeholder="3-32 位字母/数字/下划线"></div>
      <div class="field"><label>密码</label><input id="regPass" type="password" autocomplete="new-password" placeholder="至少 6 位"></div>
      <button class="btn full" type="submit">注 册</button>
      <div class="err" id="regErr"></div>
    </form>
    <div class="hint">Key 加密存储在 Cloudflare KV 中，<br>页面仅显示脱敏片段，不展示明文。</div>
  </div>
</div>

<!-- ================= 主界面 ================= -->
<div id="mainView" class="container" style="display:none">
  <div class="topbar">
    <div class="brand"><div class="dot"></div><h1>API 余额面板</h1></div>
    <div class="userbox">
      <span class="name" id="usernameLabel"></span>
      <button class="btn ghost small" onclick="logout()">退出</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="k">已绑定 Key</div><div class="v" id="statTotal">0</div></div>
    <div class="stat"><div class="k">查询成功</div><div class="v ok" id="statOk">0</div></div>
    <div class="stat"><div class="k">查询失败</div><div class="v bad" id="statFail">0</div></div>
    <div class="stat"><div class="k">最后刷新</div><div class="v small" id="statTime">--</div></div>
  </div>

  <div class="toolbar">
    <div class="refresh-hint" id="refreshHint">刷新只更新余额，不会重载页面</div>
    <button class="btn" id="refreshBtn" onclick="refreshAll()">
      <span class="spin"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></span>
      <span>刷新余额</span>
    </button>
  </div>

  <div id="keyList" class="keys"></div>
  <div id="emptyBox" class="empty" style="display:none">
    还没有绑定任何 Key。<br><br>
    <button class="btn" onclick="openAdd()">添加第一个 Key</button>
  </div>

  <div style="margin-top:20px; text-align:center">
    <button class="btn" id="addBtn" onclick="openAdd()">+ 添加 Key</button>
  </div>
</div>

<!-- ================= 添加弹窗 ================= -->
<div class="modal-mask" id="addModal">
  <div class="modal">
    <h2>添加 API Key</h2>
    <div class="sub">保存前会先用这个 Key 真实查询一次余额，<span style="color:var(--warn)">校验失败则无法添加</span>。Key 加密存储，不会明文展示。</div>
    <div class="field"><label>名称（可选）</label><input id="fName" placeholder="如：中转站 A"></div>
    <div class="field"><label>查询接口 URL *</label><input id="fEndpoint" placeholder="https://api.example.com/v1/skills/balance"></div>
    <div class="row2">
      <div class="field">
        <label>请求方法</label>
        <select id="fMethod">
          <option value="GET">GET</option>
          <option value="POST">POST</option>
        </select>
      </div>
      <div class="field"><label>余额单位（可选）</label><input id="fUnit" placeholder="如：算力 / USD / 元"></div>
    </div>
    <div class="field">
      <label>请求头模板 *（{key} 会被替换为你的密钥）</label>
      <textarea id="fHeader">Authorization: Bearer {key}</textarea>
    </div>
    <div class="field"><label>余额字段路径 *</label><input id="fPath" placeholder="balance" value="balance"></div>
    <div class="field">
      <label>API Key *（明文仅在此填写，提交后加密保存）</label>
      <input id="fKey" type="password" autocomplete="off" placeholder="sk-...">
    </div>
    <div class="ops">
      <button class="btn ghost" onclick="closeAdd()">取消</button>
      <button class="btn" id="addSubmit" onclick="submitAdd()">验证并添加</button>
    </div>
    <div class="err" id="addErr"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<div class="footer">Key 以 AES-256-GCM 加密存储于 Cloudflare KV · 明文永不出现在页面</div>

<script>
(function () {
  'use strict';
  const TOKEN_KEY = 'bk_token';
  const state = { keys: [], refreshing: false };

  const $ = (id) => document.getElementById(id);

  /* ---------- 基础请求 ---------- */
  async function api(method, path, body) {
    const opts = { method, headers: {} };
    const token = localStorage.getItem(TOKEN_KEY);
    if (token) opts.headers['Authorization'] = 'Bearer ' + token;
    if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    const res = await fetch(path, opts);
    let data = null;
    try { data = await res.json(); } catch (e) { /* ignore */ }
    if (!res.ok) throw new Error((data && (data.error || data.msg)) || ('请求失败（' + res.status + '）'));
    return data;
  }

  function toast(msg, type) {
    const el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.textContent = msg;
    $('toasts').appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 320); }, 2600);
  }

  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  function fmtTime(ts) {
    if (!ts) return '--';
    const d = new Date(ts);
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  /* ---------- 视图切换 ---------- */
  function showAuth() { $('authView').style.display = 'flex'; $('mainView').style.display = 'none'; }
  function showMain() { $('authView').style.display = 'none'; $('mainView').style.display = 'block'; }

  /* ---------- 认证 ---------- */
  window.switchTab = function (t) {
    $('tabLogin').className = t === 'login' ? 'active' : '';
    $('tabReg').className = t === 'reg' ? 'active' : '';
    $('loginForm').style.display = t === 'login' ? '' : 'none';
    $('regForm').style.display = t === 'reg' ? '' : 'none';
    $('loginErr').textContent = ''; $('regErr').textContent = '';
  };

  window.doLogin = async function (e) {
    e.preventDefault();
    $('loginErr').textContent = '';
    try {
      const r = await api('POST', '/api/auth/login', { username: $('loginUser').value.trim(), password: $('loginPass').value });
      localStorage.setItem(TOKEN_KEY, r.token);
      $('usernameLabel').textContent = r.username;
      bootMain();
    } catch (err) { $('loginErr').textContent = err.message; }
    return false;
  };

  window.doRegister = async function (e) {
    e.preventDefault();
    $('regErr').textContent = '';
    try {
      await api('POST', '/api/auth/register', { username: $('regUser').value.trim(), password: $('regPass').value });
      const r = await api('POST', '/api/auth/login', { username: $('regUser').value.trim(), password: $('regPass').value });
      localStorage.setItem(TOKEN_KEY, r.token);
      $('usernameLabel').textContent = r.username;
      bootMain();
    } catch (err) { $('regErr').textContent = err.message; }
    return false;
  };

  window.logout = async function () {
    try { await api('POST', '/api/auth/logout'); } catch (e) { /* ignore */ }
    localStorage.removeItem(TOKEN_KEY);
    state.keys = [];
    showAuth();
  };

  /* ---------- 主界面 ---------- */
  function renderList() {
    const list = $('keyList');
    list.innerHTML = '';
    $('emptyBox').style.display = state.keys.length ? 'none' : '';
    $('addBtn').style.display = state.keys.length ? '' : 'none';
    for (const k of state.keys) list.appendChild(cardEl(k));
    updateStats();
  }

  function cardEl(k) {
    const card = document.createElement('div');
    card.className = 'kcard';
    card.dataset.id = k.id;

    const ok = k.balance != null;
    const badge = '<span class="badge ' + (ok ? 'ok' : 'fail') + '">' + (ok ? '正常' : '失败') + '</span>';
    const balHtml = ok
      ? '<div class="bal"><span class="num">' + esc(k.balance) + '</span><span class="unit">' + esc(k.unit || '') + '</span></div>'
      : '<div class="bal"><span class="num zero">--</span></div>';
    const errHtml = !ok && k.lastError ? '<div class="err-text">' + esc(k.lastError) + '</div>' : '';

    card.innerHTML =
      '<div class="head">' +
        '<div>' +
          '<div class="title"><span class="nm">' + esc(k.name) + '</span><span class="mask">' + esc(k.apiKeyMask) + '</span>' + badge + '</div>' +
          '<div class="endpoint">' + esc(k.method + ' ' + k.endpoint) + ' · 字段 ' + esc(k.balancePath) + '</div>' +
        '</div>' +
        '<div class="meta"><div>添加于 ' + fmtTime(k.createdAt) + '</div></div>' +
      '</div>' +
      '<div class="body">' +
        '<div class="bal-wrap">' + balHtml + errHtml + '</div>' +
        '<div class="meta"><div>检查于 ' + fmtTime(k.lastCheckedAt) + '</div></div>' +
      '</div>' +
      '<div class="ops">' +
        '<button class="btn small ghost" onclick="refreshOne(\'' + k.id + '\')">单刷</button>' +
        '<button class="btn small danger" onclick="delKey(\'' + k.id + '\')">删除</button>' +
      '</div>';
    return card;
  }

  /* 只更新余额区域，不重绘整张卡片 —— 「只刷新余额，不刷新界面」 */
  function updateCards(keys) {
    const byId = {};
    for (const k of keys) byId[k.id] = k;
    for (const card of document.querySelectorAll('.kcard')) {
      const k = byId[card.dataset.id];
      if (!k) continue;
      const wrap = card.querySelector('.bal-wrap');
      const ok = k.balance != null;
      const balHtml = ok
        ? '<div class="bal"><span class="num">' + esc(k.balance) + '</span><span class="unit">' + esc(k.unit || '') + '</span></div>'
        : '<div class="bal"><span class="num zero">--</span></div>';
      const errHtml = !ok && k.lastError ? '<div class="err-text">' + esc(k.lastError) + '</div>' : '';
      wrap.innerHTML = balHtml + errHtml;
      const badge = card.querySelector('.badge');
      if (badge) {
        badge.className = 'badge ' + (ok ? 'ok' : 'fail');
        badge.textContent = ok ? '正常' : '失败';
      }
      const meta = card.querySelectorAll('.meta');
      if (meta.length > 1) meta[1].innerHTML = '<div>检查于 ' + fmtTime(k.lastCheckedAt) + '</div>';
      // 同步内存状态
      const idx = state.keys.findIndex((x) => x.id === k.id);
      if (idx >= 0) state.keys[idx] = k;
    }
    updateStats();
  }

  function updateStats() {
    const total = state.keys.length;
    let ok = 0, fail = 0, lastTs = 0;
    for (const k of state.keys) {
      if (k.balance != null) ok++; else fail++;
      if (k.lastCheckedAt && k.lastCheckedAt > lastTs) lastTs = k.lastCheckedAt;
    }
    $('statTotal').textContent = total;
    $('statOk').textContent = ok;
    $('statFail').textContent = fail;
    $('statTime').textContent = fmtTime(lastTs);
  }

  /* 刷新全部余额（页面加载自动调用一次；刷新按钮也只调这个） */
  window.refreshAll = async function () {
    if (state.refreshing) return;
    state.refreshing = true;
    $('refreshBtn').classList.add('loading');
    $('refreshHint').textContent = '正在刷新余额…';
    try {
      const r = await api('POST', '/api/refresh');
      if (r.keys) updateCards(r.keys);
      $('refreshHint').textContent = '刷新只更新余额，不会重载页面 · 刚刚（' + fmtTime(r.refreshedAt) + '）';
      toast('余额已刷新', 'ok');
    } catch (e) {
      $('refreshHint').textContent = '刷新只更新余额，不会重载页面';
      toast('刷新失败：' + e.message, 'error');
    } finally {
      state.refreshing = false;
      $('refreshBtn').classList.remove('loading');
    }
  };

  /* 单刷一个 */
  window.refreshOne = async function (id) {
    const btn = event && event.currentTarget;
    if (btn) btn.classList.add('loading');
    try {
      const r = await api('POST', '/api/keys/' + id + '/refresh');
      if (r.key) updateCards([r.key]);
      toast('已刷新', 'ok');
    } catch (e) { toast('刷新失败：' + e.message, 'error'); }
    if (btn) btn.classList.remove('loading');
  };

  window.delKey = async function (id) {
    if (!confirm('确定删除这个 Key？删除后不可恢复。')) return;
    try {
      await api('DELETE', '/api/keys/' + id);
      state.keys = state.keys.filter((k) => k.id !== id);
      renderList();
      toast('已删除', 'ok');
    } catch (e) { toast('删除失败：' + e.message, 'error'); }
  };

  /* ---------- 添加弹窗 ---------- */
  window.openAdd = function () {
    $('fName').value = ''; $('fEndpoint').value = ''; $('fMethod').value = 'GET';
    $('fUnit').value = ''; $('fHeader').value = 'Authorization: Bearer {key}';
    $('fPath').value = 'balance'; $('fKey').value = '';
    $('addErr').textContent = '';
    $('addModal').classList.add('open');
  };
  window.closeAdd = function () { $('addModal').classList.remove('open'); };

  window.submitAdd = async function () {
    const btn = $('addSubmit');
    const body = {
      name: $('fName').value.trim(),
      endpoint: $('fEndpoint').value.trim(),
      method: $('fMethod').value,
      unit: $('fUnit').value.trim(),
      headerTemplate: $('fHeader').value.trim(),
      balancePath: $('fPath').value.trim(),
      apiKey: $('fKey').value.trim(),
    };
    $('addErr').textContent = '';
    if (!body.apiKey) { $('addErr').textContent = '请填写 API Key'; return; }
    if (!body.endpoint) { $('addErr').textContent = '请填写查询接口 URL'; return; }
    if (!body.balancePath) { $('addErr').textContent = '请填写余额字段路径'; return; }
    btn.classList.add('loading');
    btn.firstChild.textContent = '';
    try {
      const r = await api('POST', '/api/keys', body);
      state.keys.push(r.key);
      renderList();
      closeAdd();
      toast('添加成功（已通过余额校验）', 'ok');
    } catch (e) {
      $('addErr').textContent = e.message;
    } finally {
      btn.classList.remove('loading');
    }
  };

  /* ---------- 启动 ---------- */
  function bootMain() {
    showMain();
    $('refreshHint').textContent = '正在获取余额…';
    (async () => {
      // 1) 先渲染列表（展示缓存的余额），2) 再自动刷新全部余额
      try {
        const r = await api('GET', '/api/keys');
        state.keys = r.keys || [];
        renderList();
      } catch (e) {
        toast('加载失败：' + e.message, 'error');
        return;
      }
      window.refreshAll();
    })();
  }

  (async function init() {
    const token = localStorage.getItem(TOKEN_KEY);
    if (!token) { showAuth(); return; }
    try {
      const me = await api('GET', '/api/auth/me');
      $('usernameLabel').textContent = me.username;
      bootMain();
    } catch (e) {
      localStorage.removeItem(TOKEN_KEY);
      showAuth();
    }
  })();
})();
</script>
</body>
</html>
